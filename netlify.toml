# Configuracao de deploy na Netlify.
#
# O banco e o Netlify DB (Postgres gerenciado por Neon), provisionado pelo
# pacote @netlify/database no primeiro deploy.
#
# As migrations NAO entram no comando de build: naquele momento o banco ainda
# nao foi provisionado. A Netlify aplica sozinha o SQL de
# netlify/database/migrations/, logo antes de publicar o deploy, e uma falha
# ali impede a publicacao. Esses arquivos sao gerados a partir de drizzle/
# por "npm run db:generate".

[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# O runtime precisa estar declarado: sem ele o deploy publica apenas o HTML
# estatico e as rotas de API e o middleware nao sobem como functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"
